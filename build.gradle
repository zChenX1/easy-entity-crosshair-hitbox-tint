plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Mirrors first (much faster in CN); originals kept as fallbacks.
    maven {
        name = 'AliyunPublic'
        url = uri('https://maven.aliyun.com/repository/public')
    }
    mavenCentral()
    maven {
        name = 'FabricProxy'
        url = uri('https://repository.hanbings.io/proxy')
    }
    maven {
        name = 'Fabric'
        url = uri('https://maven.fabricmc.net/')
    }
    maven {
        name = 'TerraformersMC'
        url = uri('https://maven.terraformersmc.com/releases/')
    }
}

dependencies {
    // Minecraft 26.3 is shipped without obfuscation, so no mappings (yarn) are needed
    // and mod dependencies do not have to be remapped.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Mod Menu is optional: compile time only, the entrypoint is simply ignored when it is absent.
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "java_version", project.java_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "java_version": project.java_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)
    withSourcesJar()
}

jar {
    from("LICENSE.txt") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
    }
}
